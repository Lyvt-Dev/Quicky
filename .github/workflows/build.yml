name: Build and test
on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build patchelf qt6-base-dev qt6-declarative-dev libssl-dev qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts qml6-module-qtquick-dialogs qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtqml-models qml6-module-qtquick-templates qml6-module-qtquick-nativestyle
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
      - name: Load native UI
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: ./build/Quicky --smoke-test
      - name: Package Debian build
        run: python3 packaging/linux/package.py --build build
      - uses: actions/upload-artifact@v4
        with:
          name: quicky-linux
          path: dist/*
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Build OpenSSL
        shell: pwsh
        run: |
          git clone --branch 2025.06.13 --depth 1 https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP/quicky-vcpkg"
          & "$env:RUNNER_TEMP/quicky-vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          & "$env:RUNNER_TEMP/quicky-vcpkg/vcpkg.exe" install openssl:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build, test and package installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.1.0-preview.1' }
          ./packaging/windows/build.ps1 -Version $version -QtRoot "$env:QT_ROOT_DIR" -OpenSSLRoot "$env:RUNNER_TEMP/quicky-vcpkg/installed/x64-windows"
      - name: Smoke-test installed application and uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem build-windows/Quicky-*-setup.exe | Select-Object -First 1
          $install = Join-Path $env:RUNNER_TEMP 'Quicky-install-test'
          $p = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installer failed' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QUICK_BACKEND = 'software'
          $p = Start-Process -FilePath "$install/Quicky.exe" -ArgumentList '--smoke-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Installed application failed' }
          $p = Start-Process -FilePath "$install/Uninstall.exe" -ArgumentList '/S', "_?=$install" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: quicky-windows
          path: |
            build-windows/Quicky-*-setup.exe
            build-windows/Quicky-*-setup.exe.sha256
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;26.1.10909125'
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: linux
          target: android
          arch: android_arm64_v8a
          cache: true
          aqtversion: '==3.2.1'
      - name: Build native OpenSSL and Android APK
        env:
          ANDROID_NDK_ROOT: ${{ env.ANDROID_HOME }}/ndk/26.1.10909125
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/26.1.10909125"
          bash packaging/android/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quicky-android-preview
          path: |
            build-android/android-build/build/outputs/apk/debug/*.apk
            build-android/android-build/build/outputs/apk/debug/*.sha256
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, android]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish preview release after all builds pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --prerelease --title "Quicky $GITHUB_REF_NAME" --notes-file docs/release-notes.md
